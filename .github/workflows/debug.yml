name: debug-visualize
on: workflow_dispatch
jobs:
  visualize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Add swap space
        run: |
          df -h / /mnt || true
          free -h
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 40G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          (while true; do echo "MEM $(date -u +%H:%M:%S) $(free -m | awk '/Mem/{print "used="$3} /Swap/{print "swap="$3}' | tr '\n' ' ')" >> /tmp/mem.log; sleep 30; done) &
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Unimath/agda-unimath
          ref: master
          path: mylib
      - uses: actions/checkout@v4
        with:
          repository: JobPetrovcic/agda-proof-assistent-assistent
          token: ${{ secrets.ACCESS }}
          ref: master
          path: agda-proof-assistent-assistent
      - name: Patch main.py (test only, runner copy)
        run: |
          cd agda-proof-assistent-assistent
          sed -i 's/^        entries = create_from_files(sexp_dir, lib_source_dir)$/&\n        gc.freeze()  # keep GC from scanning (swapped-out) ASTs/' main.py
          sed -i 's/^import os$/import gc\nimport os/' main.py
          git diff
      - uses: ./action
        with:
          language: agda
          file_type: src/everything.lagda.md
          mode: standalone
          install_libs: no
          additional_commands: "make src/everything.lagda.md"
      - name: Memory log
        if: always()
        run: cat /tmp/mem.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: output
          if-no-files-found: warn
